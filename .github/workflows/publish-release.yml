name: Publish FileNest Release

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
      - ".github/workflows/publish-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
      - ".github/workflows/publish-release.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Name APK and read version
        id: apk
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)
          test -n "$SRC"
          DEST="app/build/outputs/apk/release/FileNest-${VERSION}.apk"
          mv "$SRC" "$DEST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          keytool -printcert -jarfile "$DEST"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: FileNest v${{ steps.apk.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.apk }}
