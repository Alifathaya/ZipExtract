name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name APK with version
        id: apk
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          DEST="app/build/outputs/apk/debug/FileNest-${VERSION}-debug.apk"
          mv "$SRC" "$DEST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          echo "Renamed to $DEST"

      - name: Verify APK signature fingerprint
        run: |
          APK="${{ steps.apk.outputs.apk }}"
          echo "APK=$APK"
          keytool -printcert -jarfile "$APK" | sed -n 's/.*SHA1: //p; s/.*SHA256: //p'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileNest-${{ steps.apk.outputs.version }}-debug
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
