<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>License Admin</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #4ade80;
      --bad: #f87171;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(160deg, #0f172a, #1e293b 60%, #0f172a);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button.secondary { background: #334155; color: var(--text); }
    button.danger { background: var(--bad); color: #111; }
    button:disabled { opacity: .5; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    .stat {
      display: flex; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid #334155;
    }
    .stat:last-child { border-bottom: 0; }
    .keybox {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      word-break: break-all;
      margin: 8px 0;
      border: 1px dashed #475569;
    }
    .item {
      padding: 10px 0;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
    }
    .item:last-child { border-bottom: 0; }
    .muted { color: var(--muted); font-size: 0.8rem; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge.active { background: #14532d; color: var(--ok); }
    .badge.expired { background: #7f1d1d; color: var(--bad); }
    .badge.blocked { background: #78350f; color: var(--warn); }
    .badge.unused { background: #1e3a5f; color: var(--accent); }
    .badge.unlimited { background: #312e81; color: #c4b5fd; }
    .key-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .search-row { margin: 0 0 10px; }
    .search-row input {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
    }
    .search-hint { margin: 6px 0 0; font-size: 0.75rem; color: var(--muted); }
    .key-actions button {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      font-size: 0.8rem;
    }
    .err { color: var(--bad); margin-top: 8px; font-size: 0.9rem; }
    .ok { color: var(--ok); margin-top: 8px; font-size: 0.9rem; }
    .hidden { display: none; }
    .mono { font-family: ui-monospace, monospace; font-size: 0.78rem; word-break: break-all; }
    .device-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      position: relative;
    }
    .device-main { flex: 1; min-width: 0; }
    .menu-btn {
      width: 40px;
      min-width: 40px;
      margin: 0;
      padding: 6px 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 1.35rem;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .menu-btn:hover, .menu-btn[aria-expanded="true"] {
      background: #334155;
      color: var(--text);
    }
    .menu-pop {
      display: none;
      position: absolute;
      top: 36px;
      right: 0;
      z-index: 20;
      min-width: 180px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(0,0,0,.45);
      padding: 6px;
      overflow: hidden;
    }
    .menu-pop.open { display: block; }
    .menu-pop button {
      width: 100%;
      margin: 0;
      padding: 11px 12px;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      text-align: left;
    }
    .menu-pop button:hover { background: #1e293b; }
    .menu-pop button.danger {
      background: transparent;
      color: var(--bad);
    }
    .menu-pop button.danger:hover { background: #7f1d1d33; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab {
      flex: 1;
      margin: 0;
      padding: 12px 10px;
      border-radius: 12px;
      background: #1e293b;
      color: var(--muted);
      border: 1px solid #334155;
      font-weight: 700;
    }
    .tab.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <h1>License Admin</h1>
  <p class="sub">FileNest &amp; BRI Link — generate key &amp; cek device</p>

  <section id="loginCard" class="card">
    <label for="password">Password admin</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Admin password" />
    <button id="loginBtn" type="button">Masuk</button>
    <p id="loginErr" class="err hidden"></p>
  </section>

  <section id="app" class="hidden">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-app="filenest" id="tabFilenest">FileNest</button>
      <button type="button" class="tab" data-app="brilink" id="tabBrilink">BRI Link</button>
    </div>

    <div class="card">
      <div class="stat"><span>App aktif</span><strong id="statApp">FileNest</strong></div>
      <div class="stat"><span>Device terdaftar</span><strong id="statDevices">—</strong></div>
      <div class="stat"><span>Aktif (belum expired)</span><strong id="statActive">—</strong></div>
      <div class="stat"><span>Key belum dipakai</span><strong id="statKeys">—</strong></div>
      <button class="secondary" id="refreshBtn" type="button">Muat ulang</button>
      <button class="secondary" id="logoutBtn" type="button">Keluar</button>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px;font-size:1.05rem;">Generate key <span class="muted" id="genAppLabel">(FileNest)</span></h2>
      <label for="days">Hari per key</label>
      <input id="days" type="number" min="1" max="3650" value="30" />
      <label style="margin-top:10px;display:flex;align-items:center;gap:8px;color:var(--text);">
        <input id="unlimitedKey" type="checkbox" style="width:auto;margin:0;" />
        Unlimited (seumur hidup)
      </label>
      <div class="row">
        <button id="gen1" type="button">Buat 1 key</button>
        <button id="gen5" class="secondary" type="button">Buat 5</button>
      </div>
      <div id="newKeys"></div>
      <p id="genMsg" class="ok hidden"></p>
      <p id="genErr" class="err hidden"></p>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px;font-size:1.05rem;">Key terbaru</h2>
      <div class="search-row">
        <input id="keySearch" type="search" placeholder="Cari kode key atau ID HP…" autocomplete="off" />
        <p class="search-hint" id="keySearchHint"></p>
      </div>
      <div id="keyList" class="muted">Memuat…</div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px;font-size:1.05rem;">Device</h2>
      <div class="search-row">
        <input id="deviceSearch" type="search" placeholder="Cari ID HP / device id…" autocomplete="off" />
        <p class="search-hint" id="deviceSearchHint"></p>
      </div>
      <div id="deviceList" class="muted">Memuat…</div>
    </div>
  </section>

  <script>
    const TOKEN_KEY = 'filenest_admin_token';
    const APP_LABELS = { filenest: 'FileNest', brilink: 'BRI Link' };
    let token = localStorage.getItem(TOKEN_KEY) || '';
    let currentApp = localStorage.getItem('license_admin_app') || 'filenest';
    if (currentApp !== 'filenest' && currentApp !== 'brilink') currentApp = 'filenest';
    let cachedKeys = [];
    let cachedDevices = [];

    function $(id) { return document.getElementById(id); }
    function show(el, on) { el.classList.toggle('hidden', !on); }
    function appLabel() { return APP_LABELS[currentApp] || currentApp; }
    function normQ(s) { return String(s || '').trim().toLowerCase(); }

    async function api(path, opts = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      if (token) headers.Authorization = 'Bearer ' + token;
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || ('HTTP ' + res.status));
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString();
      } catch (_) { return iso; }
    }

    function setActiveTab() {
      document.querySelectorAll('.tab').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.app === currentApp);
      });
      $('statApp').textContent = appLabel();
      $('genAppLabel').textContent = '(' + appLabel() + ')';
      localStorage.setItem('license_admin_app', currentApp);
    }

    async function login() {
      show($('loginErr'), false);
      const btn = $('loginBtn');
      btn.disabled = true;
      const prev = btn.textContent;
      btn.textContent = 'Masuk...';
      try {
        const data = await api('/v1/admin/login', {
          method: 'POST',
          body: JSON.stringify({ password: $('password').value }),
        });
        token = data.token;
        localStorage.setItem(TOKEN_KEY, token);
        // Show panel immediately; data loads in background via bootstrap.
        show($('loginCard'), false);
        show($('app'), true);
        setActiveTab();
        btn.textContent = prev;
        btn.disabled = false;
        await refreshAll();
      } catch (e) {
        btn.textContent = prev;
        btn.disabled = false;
        $('loginErr').textContent = 'Login gagal: ' + e.message;
        show($('loginErr'), true);
      }
    }

    function logout() {
      token = '';
      localStorage.removeItem(TOKEN_KEY);
      show($('app'), false);
      show($('loginCard'), true);
    }

    async function enterApp() {
      show($('loginCard'), false);
      show($('app'), true);
      setActiveTab();
      await refreshAll();
    }

    async function refreshAll() {
      try {
        const data = await api(
          '/v1/admin/bootstrap?app=' + encodeURIComponent(currentApp),
        );
        const stats = data.stats || {};
        $('statDevices').textContent = stats.devices;
        $('statActive').textContent = stats.active;
        $('statKeys').textContent = stats.unusedKeys;
        cachedKeys = data.keys || [];
        cachedDevices = data.devices || [];
        renderKeys(cachedKeys);
        renderDevices(cachedDevices);
      } catch (e) {
        if (e.status === 401) logout();
        else alert(e.message);
      }
    }

    async function generate(count) {
      show($('genErr'), false);
      show($('genMsg'), false);
      const unlimited = $('unlimitedKey').checked;
      const days = Number($('days').value) || 30;
      try {
        const body = unlimited
          ? { unlimited: true, count, appId: currentApp }
          : { days, count, appId: currentApp };
        const data = await api('/v1/admin/keys/generate', {
          method: 'POST',
          body: JSON.stringify(body),
        });
        const box = $('newKeys');
        box.innerHTML = '';
        data.keys.forEach((k) => {
          const div = document.createElement('div');
          div.className = 'keybox';
          div.textContent = k.key;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'secondary';
          btn.textContent = 'Salin ' + k.key;
          btn.onclick = async () => {
            try {
              await navigator.clipboard.writeText(k.key);
              btn.textContent = 'Tersalin';
            } catch (_) {
              prompt('Salin key:', k.key);
            }
          };
          box.appendChild(div);
          box.appendChild(btn);
        });
        $('genMsg').textContent = unlimited
          ? 'Key unlimited ' + appLabel() + ' dibuat (' + data.keys.length + ')'
          : 'Key ' + appLabel() + ' dibuat (' + data.keys.length + ' × ' + days + ' hari)';
        show($('genMsg'), true);
        await refreshAll();
      } catch (e) {
        $('genErr').textContent = e.message;
        show($('genErr'), true);
      }
    }

    function filterKeys(keys, q) {
      if (!q) return keys;
      return keys.filter((k) => {
        const code = normQ(k.key_code);
        const device = normQ(k.used_by_device);
        return code.includes(q) || device.includes(q);
      });
    }

    function filterDevices(devices, q) {
      if (!q) return devices;
      return devices.filter((d) => normQ(d.device_id).includes(q));
    }

    function renderKeys(keys) {
      const el = $('keyList');
      const q = normQ($('keySearch').value);
      const filtered = filterKeys(keys, q);
      const hint = $('keySearchHint');
      if (q) {
        hint.textContent = 'Hasil: ' + filtered.length + ' dari ' + keys.length;
      } else {
        hint.textContent = keys.length ? ('Menampilkan ' + Math.min(50, keys.length) + ' terbaru') : '';
      }
      if (!keys.length) {
        el.textContent = 'Belum ada key untuk ' + appLabel() + '.';
        return;
      }
      if (!filtered.length) {
        el.textContent = 'Tidak ada key yang cocok dengan "' + $('keySearch').value.trim() + '".';
        return;
      }
      el.innerHTML = filtered.slice(0, 50).map((k) => {
        const daysLabel = Number(k.days) === 0 ? 'unlimited' : (k.days + ' hari');
        const badgeExtra = Number(k.days) === 0 ? ' unlimited' : '';
        return '<div class="item">' +
          '<div><span class="badge ' + k.status + badgeExtra + '">' + k.status +
          '</span> · ' + daysLabel + '</div>' +
          '<div class="keybox" style="font-size:0.95rem">' + k.key_code + '</div>' +
          '<div class="muted">' + fmtDate(k.created_at) +
          (k.used_by_device ? '<br>→ ' + k.used_by_device : '') +
          '</div>' +
          '<div class="key-actions">' +
            '<button type="button" class="danger" data-delete-key="' + k.key_code +
              '" data-status="' + k.status + '">Hapus</button>' +
          '</div>' +
        '</div>';
      }).join('');

      el.querySelectorAll('[data-delete-key]').forEach((btn) => {
        btn.onclick = async () => {
          const code = btn.dataset.deleteKey;
          const st = btn.dataset.status || '';
          if (!confirm('Hapus key ' + code + ' (' + st + ')? Tidak bisa dibatalkan.')) return;
          try {
            await api('/v1/admin/keys/' + encodeURIComponent(code), { method: 'DELETE' });
            await refreshAll();
          } catch (err) {
            alert(err.message);
          }
        };
      });
    }

    async function loadKeys() {
      const data = await api('/v1/admin/keys?app=' + encodeURIComponent(currentApp));
      cachedKeys = data.keys || [];
      renderKeys(cachedKeys);
    }

    function renderDevices(devices) {
      const el = $('deviceList');
      const q = normQ($('deviceSearch').value);
      const filtered = filterDevices(devices, q);
      const hint = $('deviceSearchHint');
      if (q) {
        hint.textContent = 'Hasil: ' + filtered.length + ' dari ' + devices.length;
      } else {
        hint.textContent = devices.length
          ? ('Menampilkan ' + Math.min(50, devices.length) + ' terbaru — ketik ID HP untuk cari')
          : '';
      }
      if (!devices.length) {
        el.textContent = 'Belum ada device untuk ' + appLabel() + '.';
        return;
      }
      if (!filtered.length) {
        el.textContent = 'Tidak ada device yang cocok dengan "' + $('deviceSearch').value.trim() + '".';
        return;
      }
      el.innerHTML = filtered.slice(0, 50).map((d, idx) => {
        const st = d.status || 'active';
        const unlimited = Boolean(d.unlimited);
        const stillValid = unlimited || new Date(d.expires_at).getTime() > Date.now();
        const id = d.device_id;
        const menuItems = [];
        if (st === 'blocked') {
          if (stillValid) {
            menuItems.push({ action: 'unblock', label: 'Unblock', id: id });
          } else {
            menuItems.push({ action: 'unblock', label: 'Unblock (+30 hari)', id: id, extend: true });
          }
          menuItems.push({ action: 'unblock', label: 'Unblock Unlimited', id: id, unlimited: true });
        } else if (st === 'expired') {
          menuItems.push({ action: 'allow', label: '+30 hari', id: id });
          menuItems.push({ action: 'allow', label: 'Unlimited', id: id, unlimited: true });
          menuItems.push({ action: 'block', label: 'Block', id: id, danger: true });
        } else {
          menuItems.push({ action: 'allow', label: '+30 hari', id: id, force: true });
          if (!unlimited) {
            menuItems.push({ action: 'allow', label: 'Unlimited', id: id, unlimited: true });
          }
          menuItems.push({ action: 'block', label: 'Block', id: id, danger: true });
        }
        const menuHtml = menuItems.map((m) => {
          const attrs = [
            'type="button"',
            'data-action="' + m.action + '"',
            'data-id="' + m.id + '"',
          ];
          if (m.unlimited) attrs.push('data-unlimited="1"');
          if (m.extend) attrs.push('data-extend="1"');
          if (m.force) attrs.push('data-force="1"');
          if (m.danger) attrs.push('class="danger"');
          return '<button ' + attrs.join(' ') + '>' + m.label + '</button>';
        }).join('');
        const expLabel = unlimited ? 'Unlimited' : fmtDate(d.expires_at);
        const statusBadge = unlimited && st === 'active'
          ? '<span class="badge unlimited">unlimited</span>'
          : '<span class="badge ' + st + '">' + st + '</span>';
        return '<div class="item">' +
          '<div class="device-row">' +
            '<div class="device-main">' +
              '<div>' + statusBadge + '</div>' +
              '<div class="mono">' + id + '</div>' +
              '<div class="muted">Exp: ' + expLabel + '<br>Last check: ' + fmtDate(d.last_check_at) + '</div>' +
            '</div>' +
            '<button type="button" class="menu-btn" data-menu="' + idx + '" aria-label="Menu" aria-expanded="false">⋮</button>' +
            '<div class="menu-pop" data-menu-pop="' + idx + '">' + menuHtml + '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      el.querySelectorAll('.menu-btn').forEach((btn) => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const idx = btn.dataset.menu;
          const pop = el.querySelector('[data-menu-pop="' + idx + '"]');
          const wasOpen = pop.classList.contains('open');
          closeAllDeviceMenus();
          if (!wasOpen) {
            pop.classList.add('open');
            btn.setAttribute('aria-expanded', 'true');
          }
        };
      });

      el.querySelectorAll('.menu-pop button').forEach((btn) => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          closeAllDeviceMenus();
          const action = btn.dataset.action;
          const id = btn.dataset.id;
          try {
            if (action === 'block') {
              await api('/v1/admin/devices/' + encodeURIComponent(id) + '/block', {
                method: 'POST',
                body: '{}',
              });
            } else if (action === 'unblock') {
              const body = {};
              if (btn.dataset.unlimited === '1') body.unlimited = true;
              else if (btn.dataset.extend === '1') body.days = 30;
              await api('/v1/admin/devices/' + encodeURIComponent(id) + '/unblock', {
                method: 'POST',
                body: JSON.stringify(body),
              });
            } else if (action === 'allow') {
              const body = {};
              if (btn.dataset.unlimited === '1') {
                body.unlimited = true;
              } else {
                body.days = 30;
                if (btn.dataset.force === '1') body.forceExtend = true;
              }
              await api('/v1/admin/devices/' + encodeURIComponent(id) + '/allow', {
                method: 'POST',
                body: JSON.stringify(body),
              });
            }
            await refreshAll();
          } catch (err) {
            alert(err.message);
          }
        };
      });
    }

    async function loadDevices() {
      const q = normQ($('deviceSearch').value);
      let url = '/v1/admin/devices?app=' + encodeURIComponent(currentApp);
      if (q) url += '&q=' + encodeURIComponent(q);
      const data = await api(url);
      if (!q) {
        cachedDevices = data.devices || [];
        renderDevices(cachedDevices);
        return;
      }
      // Server search: keep full cache; show matches without wiping it
      const matches = data.devices || [];
      if (!matches.length) {
        renderDevices(cachedDevices);
        return;
      }
      const hint = $('deviceSearchHint');
      const kept = $('deviceSearch').value;
      $('deviceSearch').value = '';
      renderDevices(matches);
      $('deviceSearch').value = kept;
      hint.textContent = 'Hasil: ' + matches.length;
    }

    let deviceSearchTimer = null;
    function onKeySearchInput() {
      renderKeys(cachedKeys);
    }
    function onDeviceSearchInput() {
      const q = normQ($('deviceSearch').value);
      if (!q) {
        if (cachedDevices.length) renderDevices(cachedDevices);
        else loadDevices().catch((e) => { $('deviceList').textContent = e.message; });
        return;
      }
      // Instant filter from cached full list
      if (cachedDevices.length) renderDevices(cachedDevices);
      // Also query server (covers IDs outside the recent 500)
      clearTimeout(deviceSearchTimer);
      deviceSearchTimer = setTimeout(() => {
        loadDevices().catch((e) => { $('deviceList').textContent = e.message; });
      }, 300);
    }

    function closeAllDeviceMenus() {
      document.querySelectorAll('.menu-pop.open').forEach((p) => p.classList.remove('open'));
      document.querySelectorAll('.menu-btn[aria-expanded="true"]').forEach((b) => {
        b.setAttribute('aria-expanded', 'false');
      });
    }

    document.addEventListener('click', () => closeAllDeviceMenus());

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.onclick = async () => {
        currentApp = btn.dataset.app;
        setActiveTab();
        $('newKeys').innerHTML = '';
        $('keySearch').value = '';
        $('deviceSearch').value = '';
        cachedKeys = [];
        cachedDevices = [];
        show($('genMsg'), false);
        show($('genErr'), false);
        await refreshAll();
      };
    });

    $('unlimitedKey').addEventListener('change', () => {
      $('days').disabled = $('unlimitedKey').checked;
    });

    $('keySearch').addEventListener('input', onKeySearchInput);
    $('deviceSearch').addEventListener('input', onDeviceSearchInput);

    $('loginBtn').onclick = login;
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    $('logoutBtn').onclick = logout;
    $('refreshBtn').onclick = refreshAll;
    $('gen1').onclick = () => generate(1);
    $('gen5').onclick = () => generate(5);

    if (token) {
      enterApp().catch(() => logout());
    }
  </script>
</body>
</html>
